<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Site en maintenance</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2530;
    --cobalt:#8FB6F7;
    --paper:#F2F1ED;
    --line:#3A4552;
    --muted:#A6AFBA;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;padding:0;}

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100%;
    background:var(--ink);
    font-family:"Inter", sans-serif;
    color:var(--paper);
    padding:6vh 1.5rem;
    text-align:center;
  }

  .wrap{
    max-width:480px;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .icon{
    width:64px;
    height:64px;
    margin:0 0 2rem;
  }
  .icon svg{
    width:100%;
    height:100%;
  }
  .icon circle{
    fill:none;
    stroke:var(--line);
    stroke-width:2;
  }
  .icon .arc{
    stroke:var(--cobalt);
    stroke-width:2;
    stroke-linecap:round;
    fill:none;
    transform-origin:50% 50%;
    animation:turn 1.8s linear infinite;
  }
  @keyframes turn{
    to{transform:rotate(360deg);}
  }
  @media (prefers-reduced-motion: reduce){
    .icon .arc{animation:none;}
  }

  .logo{
    height:44px;
    width:auto;
    margin:0 0 2.5rem;
  }

  h1{
    font-weight:500;
    font-size:1.5rem;
    line-height:1.4;
    margin:0 0 1rem;
    color:var(--paper);
  }

  p.lead{
    font-size:1rem;
    line-height:1.65;
    color:var(--muted);
    margin:0 0 2.5rem;
    max-width:36ch;
  }

  .footer{
    font-size:0.85rem;
    color:var(--muted);
    border-top:1px solid var(--line);
    padding-top:1.25rem;
    width:100%;
  }

  .footer a{
    color:var(--paper);
    text-decoration:none;
    border-bottom:1px solid var(--line);
  }
  .footer a:hover{
    border-bottom-color:var(--paper);
  }
</style>
</head>
